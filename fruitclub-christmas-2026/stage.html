<!doctype html>
<html lang="zh-Hant-TW"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="robots" content="noindex,nofollow,noarchive">

<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' blob:; style-src 'self' 'unsafe-inline' blob:; connect-src 'self'; img-src 'self' blob: data:; font-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>水果幫的聖誕邀請｜因為有你，心存感恩</title>
<link rel="icon" href="cover-citrus.svg" type="image/svg+xml"><link rel="stylesheet" href="invitation.css"><script defer src="invitation.js"></script>
</head><body>
<div class="invite-shell">
<header class="invite-brand"><img src="cover-citrus.svg" width="42" height="42" alt=""><span><b>水果幫</b><small>FRUIT CLUB</small></span></header>
<main class="invite-card">
<figure class="invite-paper"><img src="cover.jpg" width="1448" height="1086" alt="水果幫的聖誕邀請卡，書法「因、心」串起因為有你，心存感恩。"></figure>
<section class="invite-form" aria-labelledby="welcome"><p class="invite-kicker"><span aria-hidden="true">✦</span> CHRISTMAS 2026</p><h1 id="welcome">聖誕邀請函</h1>
<p class="invite-note">給水果幫的大小朋友<br>輸入邀請密碼，一起來過聖誕。</p>
<form id="unlock-form"><label for="invite-code">邀請密碼</label><div class="invite-field"><input type="password" id="invite-code" autocomplete="current-password" autocapitalize="characters" spellcheck="false" maxlength="128" required aria-describedby="invite-status"><button type="button" id="show-code" aria-label="顯示密碼" aria-pressed="false">顯示</button></div>
<button class="invite-enter" id="unlock-button" type="submit"><span aria-hidden="true">✦</span> 開啟邀請</button>
<p id="invite-status" role="status" aria-live="polite"></p></form><noscript><p>請啟用瀏覽器的 JavaScript，再輸入邀請密碼。</p></noscript>
</section></main>
<footer class="invite-foot"><span>因為有你，心存感恩</span><span aria-hidden="true">✧</span><span>水果幫 × 水果家</span></footer>
</div></body></html>

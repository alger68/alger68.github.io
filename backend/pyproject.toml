[tool.poetry]
name = "quant-platform-backend"
version = "0.1.0"
description = "Backend skeleton for quantitative trading platform"
authors = ["Quant Team <dev@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
pydantic = "^2.6.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["argon2"], version = "^1.7.4"}
httpx = "^0.27.0"
redis = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
ruff = "^0.3.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
